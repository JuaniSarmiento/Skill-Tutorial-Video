<!doctype html>
<!--
Escena "diagrama": nodos y flechas que se dibujan de a uno, cada uno en su cue.

spec:
  {"tipo": "diagrama",
   "kicker": "...", "titulo": {"texto": "Cómo crece la plata"},
   "nodos":   [{"id": "c", "texto": "Capital", "detalle": "1.000 $", "cue": "capital"}, ...],
   "flechas": [{"de": "c", "a": "i", "texto": "rinde", "cue": "rinde"}, ...]}

Por defecto los nodos van en una fila, con el espacio entre ellos calculado para que
la etiqueta de cada flecha entre sin tocar a nadie. Si no entran en una fila a 36 px,
van en dos filas en "S" (la segunda de derecha a izquierda, así la flecha que las une
baja derecho); si tampoco entran a 24 px, la escena falla en vez de pisar textos. Un
texto de nodo largo se parte en renglones. Para otra forma, cada nodo acepta "x" e "y"
(centro, en fracción de pantalla: 0.5 = medio), acotados para que el nodo no se salga.
El último elemento que entró es el foco y lleva el color de acento; el resto, neutro.
-->
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .nodo {
    position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 22px; background: var(--superficie); border: 3px solid var(--borde);
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .7);
  }
  .nodo .txt { font-weight: 650; letter-spacing: -.015em; white-space: pre; text-align: center; line-height: 1.15; }
  .nodo .det { margin-top: 10px; font-size: 32px; font-weight: 500; color: var(--tenue); white-space: nowrap; }
  .etq {
    position: absolute; transform: translate(-50%, -50%); padding: 4px 14px; white-space: nowrap;
    font-size: 36px; font-weight: 600; color: var(--tenue); background: var(--fondo); border-radius: 8px;
  }
</style>
<script src="base.js"></script>
<script>
  const { S, crear, tiempo, resorte, salida, aparecer, contrato, cabecera, medir, clamp } = E;
  const nodos = (S.nodos || []).map((n, i) => ({ ...n, t0: tiempo(n, 0.4 + i * 0.8) }));
  const flechas = (S.flechas || []).map((f, i) => ({ ...f, t0: tiempo(f, (nodos[i + 1]?.t0 ?? 1) - 0.3) }));
  const porId = Object.fromEntries(nodos.map(n => [n.id, n]));
  for (const f of flechas) {
    if (!porId[f.de] || !porId[f.a]) throw new Error(`flecha ${f.de} -> ${f.a}: nodo inexistente`);
  }
  const AREA = { x0: 140, x1: 1780, y0: 340, y1: 1000 };
  const PISO = 24, UNA_FILA = 36;   // px: piso legible, y el mínimo antes de pasar a dos filas
  const MAX_TXT = 560, ENTRE_FILAS = 150;
  const NS = 'http://www.w3.org/2000/svg';
  let dibujarCab;

  // renglones de un texto que no pasan de MAX_TXT px
  function renglones(texto, px) {
    const out = [];
    for (const w of String(texto).split(/\s+/)) {
      const prueba = out.length ? out[out.length - 1] + ' ' + w : w;
      if (out.length && medir(prueba, px, 650) <= MAX_TXT) out[out.length - 1] = prueba;
      else out.push(w);
    }
    return out;
  }

  const medida = (n, px) => {
    n.lineas = renglones(n.texto, px);
    const w = Math.max(...n.lineas.map(l => medir(l, px, 650)), n.detalle ? medir(n.detalle, 32, 500) : 0);
    return { w: Math.max(px * 5.5, w + 120), h: n.lineas.length * px * 1.15 + 88 + (n.detalle ? 46 : 0) };
  };
  const flechaEntre = (a, b) => flechas.find(f => [f.de, f.a].sort().join() === [a.id, b.id].sort().join());
  // el hueco entre dos nodos vecinos tiene que alojar la etiqueta de su flecha
  const hueco = (a, b) => { const f = flechaEntre(a, b); return Math.max(170, f && f.texto ? medir(f.texto, 36, 600) + 28 + 80 : 0); };
  const anchoFila = R => R.reduce((s, n) => s + n.w, 0) + R.slice(1).reduce((s, n, i) => s + hueco(R[i], n), 0);
  const altoFila = R => Math.max(...R.map(n => n.h));

  function colocarFila(R, cy) {
    const huecos = R.slice(1).map((n, i) => hueco(R[i], n));
    const libre = (AREA.x1 - AREA.x0 - anchoFila(R)) / Math.max(1, R.length - 1);
    let x = 0;
    R.forEach((n, i) => { n.cx = x + n.w / 2; n.cy = cy; x += n.w + (huecos[i] ?? 0) + Math.min(libre, 120); });
    // si sobró lugar (el tope de 120 por hueco), se centra la fila entera
    const izq = R[0].cx - R[0].w / 2, der = R.at(-1).cx + R.at(-1).w / 2;
    const dx = (AREA.x0 + AREA.x1) / 2 - (izq + der) / 2;
    R.forEach(n => { n.cx += dx; });
  }

  // Tamaños y posiciones: una sola vez, con las fuentes ya cargadas.
  function layout() {
    if (!nodos.length) return 54;
    if (nodos.every(n => n.x != null && n.y != null)) {
      const px = 54;
      nodos.forEach(n => {
        Object.assign(n, medida(n, px));
        n.cx = Math.min(1920 - n.w / 2 - 40, Math.max(n.w / 2 + 40, n.x * 1920));
        n.cy = Math.min(1080 - n.h / 2 - 40, Math.max(n.h / 2 + 40, n.y * 1080));
      });
      return px;
    }
    const mitad = Math.ceil(nodos.length / 2);
    const intentos = [];
    for (let px = 54; px >= UNA_FILA; px -= 2) intentos.push([px, [nodos]]);
    if (nodos.length > 1)   // la segunda fila va de derecha a izquierda: se guarda en el orden en que se ve
      for (let px = 54; px >= PISO; px -= 2) intentos.push([px, [nodos.slice(0, mitad), nodos.slice(mitad).reverse()]]);
    for (const [px, filas] of intentos) {
      nodos.forEach(n => Object.assign(n, medida(n, px)));
      const alto = filas.reduce((s, R) => s + altoFila(R), 0) + (filas.length - 1) * ENTRE_FILAS;
      if (filas.some(R => anchoFila(R) > AREA.x1 - AREA.x0) || alto > AREA.y1 - AREA.y0) continue;
      let y = (AREA.y0 + AREA.y1) / 2 - alto / 2;
      for (const R of filas) { colocarFila(R, y + altoFila(R) / 2); y += altoFila(R) + ENTRE_FILAS; }
      if (filas.length === 2) {
        // la punta de la S: el primero de la fila de abajo, debajo del último de la de arriba
        const [A, B] = filas;
        let dx = A.at(-1).cx - B.at(-1).cx;
        dx = Math.min(dx, AREA.x1 - (B.at(-1).cx + B.at(-1).w / 2));
        dx = Math.max(dx, AREA.x0 - (B[0].cx - B[0].w / 2));
        B.forEach(n => { n.cx += dx; });
      }
      return px;
    }
    throw new Error(`el diagrama no entra en pantalla ni en dos filas a ${PISO} px (${nodos.length} nodos): ` +
                    'usá menos nodos, textos más cortos o "x"/"y" por nodo');
  }

  // punto del borde del rectángulo de n en dirección (dx, dy) desde su centro
  function borde(n, dx, dy, margen) {
    const sx = (n.w / 2 + margen) / Math.abs(dx || 1e-9), sy = (n.h / 2 + margen) / Math.abs(dy || 1e-9);
    const s = Math.min(sx, sy);
    return [n.cx + dx * s, n.cy + dy * s];
  }

  contrato([tiempo(S.titulo, 0), ...nodos.map(n => n.t0), ...flechas.map(f => f.t0)], () => {
    dibujarCab = cabecera(S.titulo, S.kicker).dibujar;
    const px = layout();
    const svg = document.createElementNS(NS, 'svg');
    document.body.appendChild(svg);
    for (const f of flechas) {
      const a = porId[f.de], b = porId[f.a];
      const dx = b.cx - a.cx, dy = b.cy - a.cy, d = Math.hypot(dx, dy);
      const [x1, y1] = borde(a, dx / d, dy / d, 16), [x2, y2] = borde(b, -dx / d, -dy / d, 22);
      f.largo = Math.hypot(x2 - x1, y2 - y1);
      f.linea = document.createElementNS(NS, 'line');
      Object.entries({ x1, y1, x2, y2, 'stroke-width': 6, 'stroke-linecap': 'round' })
        .forEach(([k, v]) => f.linea.setAttribute(k, v));
      f.punta = document.createElementNS(NS, 'path');
      f.punta.setAttribute('d', 'M -24 -14 L 2 0 L -24 14 Z');
      f.punta.setAttribute('transform', `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`);
      svg.append(f.linea, f.punta);
      if (f.texto) {
        f.etq = crear('div', 'etq', document.body, f.texto);
        f.etq.dataset.caja = 'flecha ' + f.texto;
        const nx = -dy / d, ny = dx / d, lado = ny > 0 ? -1 : 1;   // la etiqueta va del lado de arriba
        // a un costado de la línea: media etiqueta en la dirección de la normal, y aire
        const r = f.etq.getBoundingClientRect();
        const lejos = Math.abs(nx) * r.width / 2 + Math.abs(ny) * r.height / 2 + 14;
        f.etq.style.left = ((x1 + x2) / 2 + nx * lejos * lado) + 'px';
        f.etq.style.top = ((y1 + y2) / 2 + ny * lejos * lado) + 'px';
      }
    }
    for (const n of nodos) {
      n.el = crear('div', 'nodo');
      n.el.dataset.caja = 'nodo ' + n.id;
      Object.assign(n.el.style, { width: n.w + 'px', height: n.h + 'px', left: (n.cx - n.w / 2) + 'px', top: (n.cy - n.h / 2) + 'px' });
      crear('div', 'txt', n.el, n.lineas.join('\n')).style.fontSize = px + 'px';
      if (n.detalle) crear('div', 'det', n.el, n.detalle);
    }
  }, t => {
    dibujarCab(t);
    // foco: el elemento (nodo o flecha) que entró más recientemente
    const entrados = [...nodos, ...flechas].filter(x => t >= x.t0);
    const foco = entrados.reduce((f, x) => (!f || x.t0 >= f.t0 ? x : f), null);
    for (const n of nodos) {
      const v = resorte(t - n.t0);
      n.el.style.opacity = aparecer(t, n.t0);
      // sube a su lugar en vez de escalar: scale() sobre la esquina redondeada deja
      // estado de raster entre cuadros y el mismo t salía con pixeles distintos
      n.el.style.top = (n.cy - n.h / 2 + (1 - v) * (E.M.subida ?? 28)).toFixed(2) + 'px';
      n.el.style.borderColor = n === foco ? 'var(--acento)' : 'var(--borde)';
    }
    for (const f of flechas) {
      const p = salida((t - f.t0) / 0.55);
      const color = f === foco ? 'var(--acento)' : 'var(--tenue)';
      f.linea.setAttribute('stroke', color);
      f.linea.setAttribute('stroke-dasharray', `${f.largo} ${f.largo}`);
      f.linea.setAttribute('stroke-dashoffset', (f.largo * (1 - p)).toFixed(2));
      f.linea.style.opacity = t >= f.t0 ? 1 : 0;
      f.punta.setAttribute('fill', color);
      f.punta.style.opacity = clamp((p - 0.82) / 0.18);
      if (f.etq) f.etq.style.opacity = aparecer(t, f.t0 + 0.25);
    }
  });
</script>
