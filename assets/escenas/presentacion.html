<!doctype html>
<!--
Escena "presentacion": título cinético + puntos que entran de a uno, cada uno en su cue.

spec:
  {"tipo": "presentacion",
   "kicker": "Finanzas personales",                    (opcional)
   "titulo": {"texto": "El interés compuesto", "cue": 0},
   "subtitulo": {"texto": "...", "cue": "..."},        (opcional; sólo sin puntos)
   "puntos": [{"texto": "Ganás intereses", "cue": "intereses"}, ...]}

Sin puntos es una portada: el título grande, centrado en vertical.
Con muchos puntos la letra se achica hasta que entran (cuerpo de 42 a 28 px, y con
el piso se juntan los renglones); si ni así entran, la escena falla en vez de dejar
puntos fuera de pantalla. Nada baja de la banda de subtítulos (E.BANDA, 83 % del alto).

Número protagonista (H2, el dato clave de la escena, como el gancho de la prueba con
HyperFrames): en vez de puntos,
   "numero": {"texto": "10", "unidad": "años", "cue": "diez años"},
   "contra": {"texto": "30", "unidad": "años", "cue": "treinta"},   (opcional)
   "subtitulo": {"texto": "Si arrancás antes", "cue": "..."}        (opcional, abajo)
El número va gigante (de 360 a 300 px) en acento; el de contraste, igual de grande en
tenue. Si no entran a 300 px la escena falla nombrando el número: acortalo ("1,2 M").
"numero" y "puntos" no van juntos.
-->
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .portada { position: absolute; left: 140px; right: 240px; top: 50%; transform: translateY(-50%); }
  .portada .titulo { font-size: 120px; letter-spacing: -.035em; line-height: 1.02; }
  .portada .kicker { margin-bottom: 34px; font-size: 24px; }
  .barra { width: 96px; height: 8px; border-radius: 4px; background: var(--acento); margin: 44px 0 34px; }
  /* position: absolute para que NO cuente en el alto de .portada: si contara, el
     centrado vertical reservaría su lugar desde el arranque (aunque todavía no
     hubiera entrado por su cue) y el kicker+título+barra quedarían pegados arriba
     con la mitad de abajo vacía mientras el subtítulo espera su turno. */
  .sub { position: absolute; left: 0; top: 100%; display: table; font-size: 54px;
         font-weight: 500; color: var(--tenue); letter-spacing: -.01em; }
  .puntos { position: absolute; left: 140px; right: 140px; top: 300px; bottom: 184px;
            display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .punto { display: flex; align-items: baseline; gap: 32px; }
  .num { width: 56px; flex: none; font-family: var(--fuente-mono); font-size: 24px; font-weight: 600; color: var(--tenue); }
  .txt { display: table; font-size: 68px; font-weight: 500; letter-spacing: -.01em; line-height: 1.18; }
  .numeros { position: absolute; left: 140px; width: max-content; display: flex; align-items: baseline; gap: 120px; }
  .bloque { display: flex; align-items: baseline; gap: 28px; transform-origin: 0 100%; }
  .cifra { font-family: var(--fuente-titulos); font-weight: 900; line-height: .85; letter-spacing: -.045em; white-space: nowrap; }
  .unidad { font-family: var(--fuente-titulos); font-size: 72px; font-weight: 700; color: var(--tenue); white-space: nowrap; }
  .lema { position: absolute; left: 140px; display: table; font-family: var(--fuente-titulos);
          font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  /* "marcar" (H6, HITO3.md): subrayado/círculo/resaltado dibujados a mano sobre una
     palabra, con la misma técnica de stroke-dasharray/dashoffset de imagen.html
     (nunca GSAP: presentacion.html usa el "contrato" manual, no E.lineaDeTiempo). */
  svg.marcas { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  .marca { fill: none; stroke-linecap: round; }
  .marca.subrayado { stroke: var(--acento); stroke-width: 6; }
  .marca.circulo { stroke: var(--acento); stroke-width: 5; }
  .marca.resaltado { stroke: var(--acento); stroke-width: 34; }
</style>
<script src="base.js"></script>
<script>
  const { S, crear, tiempo, resorte, aparecer, salida, contrato, cabecera, M, BANDA } = E;
  const CUERPO = 42, PISO = 28;   // px del cuerpo: de 42 se achica hasta 28, menos no se lee en un celular
  // Una lista corta (hasta 4 puntos) no es cuerpo: es lo que se lee de la escena. Va de 68
  // a 44 px y sólo si ni así entra sigue achicándose como cuerpo.
  const CORTA = 4, GRANDE = 68, GRANDE_MIN = 44;
  const CIFRA = 360, CIFRA_MIN = 300;   // px del número protagonista
  const puntos = (S.puntos || []).map((p, i) => ({ ...p, t0: tiempo(p, 0.8 + i * 0.9) }));
  if (S.numero && puntos.length)
    throw new Error('"numero" y "puntos" no van juntos: el número protagonista va solo en su escena');
  const numeros = S.numero ? [S.numero, S.contra].filter(Boolean).map((n, i) => ({ ...n, t0: tiempo(n, 0.4 + i * 0.8) })) : [];
  const COMO_VALIDOS = ['subrayado', 'circulo', 'resaltado'];
  const marcas = (S.marcar || []).map(m => {
    if (!COMO_VALIDOS.includes(m.como))
      throw new Error(`"marcar" tiene un "como" inválido (${JSON.stringify(m.como)}): ` +
                      `tiene que ser ${COMO_VALIDOS.join(' | ')}`);
    return { ...m, t0: tiempo(m, 0) };
  });
  const NS = 'http://www.w3.org/2000/svg';

  // Envuelve la primera ocurrencia (como palabra completa, sin mirar mayúsculas)
  // de `texto` dentro de `raiz` en un <span>, y devuelve ese span (o null si no
  // está). No es un selector CSS: busca en los NODOS DE TEXTO ya armados, así
  // que funciona sobre el título, un punto o el subtítulo por igual.
  function envolverPalabra(raiz, texto) {
    const buscar = texto.toLowerCase();
    const walker = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
    let nodo;
    while ((nodo = walker.nextNode())) {
      const low = nodo.textContent.toLowerCase();
      const i = low.indexOf(buscar);
      if (i === -1) continue;
      const antes = i === 0 || /\s/.test(low[i - 1]);
      const despues = i + buscar.length >= low.length || /\s/.test(low[i + buscar.length]);
      if (!antes || !despues) continue;
      const span = document.createElement('span');
      span.textContent = nodo.textContent.slice(i, i + texto.length);
      const resto = document.createTextNode(nodo.textContent.slice(i + texto.length));
      nodo.textContent = nodo.textContent.slice(0, i);
      nodo.parentNode.insertBefore(resto, nodo.nextSibling);
      nodo.parentNode.insertBefore(span, resto);
      return span;
    }
    return null;
  }

  function pathDeMarca(como, r) {
    if (como === 'subrayado') {
      const y = r.bottom + 6;
      return `M ${(r.left - 4).toFixed(1)},${y.toFixed(1)} Q ${((r.left + r.right) / 2).toFixed(1)},${(y + 9).toFixed(1)} ${(r.right + 4).toFixed(1)},${y.toFixed(1)}`;
    }
    if (como === 'circulo') {
      const cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
      const rx = (r.right - r.left) / 2 + 20, ry = (r.bottom - r.top) / 2 + 16;
      return `M ${(cx - rx).toFixed(1)},${cy.toFixed(1)} ` +
             `C ${(cx - rx).toFixed(1)},${(cy - ry).toFixed(1)} ${(cx + rx).toFixed(1)},${(cy - ry).toFixed(1)} ${(cx + rx).toFixed(1)},${cy.toFixed(1)} ` +
             `C ${(cx + rx).toFixed(1)},${(cy + ry).toFixed(1)} ${(cx - rx).toFixed(1)},${(cy + ry).toFixed(1)} ${(cx - rx).toFixed(1)},${cy.toFixed(1)} Z`;
    }
    // resaltado: una pasada gruesa y translúcida por el medio de la palabra
    const y = (r.top + r.bottom) / 2;
    return `M ${(r.left - 6).toFixed(1)},${y.toFixed(1)} L ${(r.right + 6).toFixed(1)},${y.toFixed(1)}`;
  }

  // arma el SVG de las marcas DESPUÉS de que el resto del DOM ya tiene su texto
  // final: envolverPalabra mide el layout real, no uno a medio construir.
  function montarMarcas() {
    if (!marcas.length) return;
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'marcas');
    document.body.appendChild(svg);
    for (const m of marcas) {
      const span = envolverPalabra(document.body, m.texto);
      if (!span)
        throw new Error(`"marcar" no encontró la palabra ${JSON.stringify(m.texto)} en el texto de la escena`);
      const r = span.getBoundingClientRect();
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('class', 'marca ' + m.como);
      path.setAttribute('d', pathDeMarca(m.como, r));
      path.dataset.caja = 'marca ' + m.texto;
      path.dataset.t = m.t0;
      if (m.como === 'resaltado') path.style.opacity = 0;   // se corrige en dibujar(t): 0.35 x fundido
      svg.appendChild(path);
      m.el = path;
      m.largo = path.getTotalLength();
    }
  }
  const portada = !puntos.length && !numeros.length;
  const tTitulo = tiempo(S.titulo, 0);
  const tSub = S.subtitulo ? tiempo(S.subtitulo, tTitulo + 0.6) : null;
  let dibujarCab, barra, sub, filas = [];

  // Número protagonista: cabecera arriba (o sólo el kicker), la fila de números centrada
  // en lo que queda hasta la banda, y el subtítulo debajo.
  function montarNumeros(cab) {
    let techo;
    if (S.titulo) techo = cab.techo(300, CIFRA_MIN, BANDA);
    else {
      techo = 200;
      if (S.kicker) {
        const k = crear('div', 'kicker', crear('header', 'cabecera'), S.kicker.texto || S.kicker);
        k.dataset.caja = 'kicker';
        const tk = tiempo(S.kicker, 0);
        dibujarCab = t => { k.style.opacity = aparecer(t, tk); };
        techo = k.getBoundingClientRect().bottom + 60;
      }
    }
    const fila = crear('div', 'numeros');
    numeros.forEach((n, i) => {
      n.el = crear('div', 'bloque', fila);
      n.el.dataset.caja = i ? 'contra' : 'numero';
      n.el.dataset.t = n.t0;
      n.cifra = crear('span', 'cifra', n.el, n.texto);
      n.cifra.style.color = i ? 'var(--tenue)' : 'var(--acento)';
      if (n.unidad) crear('span', 'unidad', n.el, n.unidad);
    });
    let px = CIFRA;
    const cabe = () => fila.getBoundingClientRect().width <= 1920 - 2 * 140;
    for (; px >= CIFRA_MIN; px -= 4) {
      numeros.forEach(n => { n.cifra.style.fontSize = px + 'px'; });
      if (cabe()) break;
    }
    if (!cabe())
      throw new Error(`el número ${JSON.stringify(numeros.map(n => n.texto).join(' / '))} no entra ni a ` +
                      `${CIFRA_MIN} px: acortalo ("1,2 M" en vez de "1.200.000") o sacá la unidad`);
    let altoSub = 0;
    if (S.subtitulo) {
      sub = crear('div', 'lema', document.body, S.subtitulo.texto || S.subtitulo);
      sub.dataset.caja = 'subtitulo';
      sub.dataset.t = tSub;
      altoSub = sub.getBoundingClientRect().height + 48;
    }
    const alto = fila.getBoundingClientRect().height;
    const y = techo + Math.max(0, (BANDA - techo - alto - altoSub) / 2);
    if (y + alto + altoSub > BANDA)
      throw new Error('el número protagonista no entra entre el título y la banda de subtítulos: acortá el título');
    fila.style.top = y + 'px';
    if (sub) sub.style.top = (y + alto + 48) + 'px';
    montarMarcas();
  }

  contrato([tTitulo, tSub ?? 0, ...puntos.map(p => p.t0), ...numeros.map(n => n.t0), ...marcas.map(m => m.t0)], () => {
    const cab = cabecera(S.titulo, S.kicker);
    dibujarCab = cab.dibujar;
    if (numeros.length) return montarNumeros(cab);
    const header = document.querySelector('.cabecera');
    if (portada && header) {
      header.className = 'portada';
      barra = crear('div', 'barra', header);
      if (S.subtitulo) { sub = crear('div', 'sub', header, S.subtitulo.texto || S.subtitulo); sub.dataset.caja = 'subtitulo'; sub.dataset.t = tSub; }
    }
    const lista = crear('section', 'puntos');
    // la lista arranca debajo de la cabecera medida (al menos un renglón al piso)
    const top = portada ? 300 : cab.techo(300, PISO * 1.18, BANDA);
    lista.style.top = top + 'px';
    const culpa = top > 300 ? ` (o acortá el título, que baja la lista hasta y=${Math.round(top)})` : '';
    filas = puntos.map((p, i) => {
      const fila = crear('div', 'punto', lista);
      const num = crear('div', 'num', fila, String(i + 1).padStart(2, '0'));
      const txt = crear('div', 'txt', fila, p.texto);
      txt.dataset.caja = 'punto ' + (i + 1);
      txt.dataset.t = p.t0;   // la puerta (verificar.py) mide que no se vea antes
      return { fila, num, txt, t0: p.t0 };
    });
    // achicar hasta que la lista entre en su caja, sin bajar del piso legible; al piso,
    // se juntan los renglones antes de rendirse
    const alto = () => filas.length ? filas.at(-1).fila.getBoundingClientRect().bottom - filas[0].fila.getBoundingClientRect().top : 0;
    const intentos = [];
    if (filas.length <= CORTA) for (let px = GRANDE; px >= GRANDE_MIN; px -= 2) intentos.push([px, 0.77]);
    for (let px = CUERPO; px >= PISO; px -= 2) intentos.push([px, 0.77]);
    intentos.push([PISO, 0.6]);   // 0.6 x 28 = 17 px: el aire mínimo entre dos renglones
    for (const [px, aire] of intentos) {
      lista.style.gap = (px * aire).toFixed(1) + 'px';
      filas.forEach(x => { x.txt.style.fontSize = px + 'px'; });
      if (alto() <= lista.clientHeight) break;
    }
    if (alto() > lista.clientHeight)
      throw new Error(`los ${filas.length} puntos no entran en pantalla ni a ${PISO} px: partilos en dos escenas${culpa}`);
    montarMarcas();
  }, t => {
    dibujarCab(t);
    for (const m of marcas) {
      const p = salida((t - m.t0) / 0.5);
      m.el.setAttribute('stroke-dasharray', m.largo);
      m.el.setAttribute('stroke-dashoffset', (m.largo * (1 - p)).toFixed(2));
      m.el.style.opacity = m.como === 'resaltado' ? 0.35 * aparecer(t, m.t0) : aparecer(t, m.t0, 0.12);
    }
    for (const n of numeros) {
      const v = resorte(t - n.t0);
      n.el.style.opacity = aparecer(t, n.t0);
      n.el.style.transform = `translateY(${((1 - v) * (M.subida ?? 28)).toFixed(2)}px) scale(${(0.9 + 0.1 * v).toFixed(4)})`;
    }
    if (sub && numeros.length) {
      sub.style.opacity = aparecer(t, tSub);
      sub.style.transform = `translateY(${((1 - resorte(t - tSub)) * (M.subida ?? 28)).toFixed(2)}px)`;
      return;
    }
    if (barra) {
      const tb = tTitulo + 0.35;
      barra.style.width = (96 * resorte(t - tb)).toFixed(2) + 'px';
    }
    if (sub) {
      sub.style.opacity = aparecer(t, tSub);
      sub.style.transform = `translateY(${((1 - resorte(t - tSub)) * (M.subida ?? 28)).toFixed(2)}px)`;
    }
    // el foco es el último punto que ya entró: su número va en acento
    const foco = filas.reduce((f, x, i) => (t >= x.t0 ? i : f), -1);
    filas.forEach((x, i) => {
      x.fila.style.opacity = aparecer(t, x.t0);
      x.fila.style.transform = `translateY(${((1 - resorte(t - x.t0)) * (M.subida ?? 28)).toFixed(2)}px)`;
      x.num.style.color = i === foco ? 'var(--acento)' : 'var(--tenue)';
      // el punto en foco en texto; los que ya pasaron, en tenue (se lee dónde va la voz)
      // los anteriores, entre tenue y texto: ~8:1 sobre el fondo (el tenue solo, 5,9:1, casi no se veía)
      x.txt.style.color = i === foco ? 'var(--texto)' : 'color-mix(in srgb, var(--texto) 30%, var(--tenue))';
    });
  });
</script>
