<!doctype html>
<!--
Escena "datos": barras que crecen hasta su valor, cada una en su cue.

spec:
  {"tipo": "datos",
   "kicker": "...", "titulo": {"texto": "1.000 pesos al 10 % anual"},
   "prefijo": "$", "sufijo": "",                     (opcionales, alrededor del número)
   "barras": [{"etiqueta": "Año 0", "valor": 1000, "cue": "hoy"},
              {"etiqueta": "Año 30", "valor": 17449, "cue": "treinta", "destacar": true}],
   "nota": "Fuente: ..."}                              (opcional, abajo a la derecha)

La barra destacada va en el color de acento; el resto, neutras. El número cuenta
hacia arriba mientras la barra crece. Las barras usan un resorte sin overshoot:
en un gráfico, pasarse del valor aunque sea un instante es mentir.

El número se muestra con los decimales que trae el dato (3.5 -> "3,5"; hasta 6, y
sin el ruido de coma flotante: 0.1 + 0.2 -> "0,3"), en formato es-AR, con el signo
antes del prefijo ("-$500"). Un valor que se vería "0" sin serlo (1e-7) es un error. Un negativo cuelga debajo de la línea de cero y un cero no tiene barra. Una
barra sin `valor` numérico es un error: dibujar "NaN" o inventar un cero es mentir.
Si los números no entran ni a 24 px, la escena falla en vez de pisarlos.
-->
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .base { position: absolute; height: 3px; background: var(--borde); border-radius: 2px; }
  .barra { position: absolute; border-radius: 12px 12px 3px 3px;
           background: color-mix(in srgb, var(--texto) 20%, var(--fondo)); }
  .barra.destacada { background: var(--acento); }
  .valor { position: absolute; transform: translateX(-50%); white-space: nowrap;
           font-size: 64px; font-weight: 700; letter-spacing: -.02em; }
  .cat { position: absolute; text-align: center; line-height: 1.2;
         font-size: 36px; font-weight: 500; color: var(--tenue); }
  .nota { position: absolute; right: 140px; font-size: 20px; color: var(--tenue); }
</style>
<script src="base.js"></script>
<script>
  const { S, crear, tiempo, resorte, aparecer, contrato, cabecera, medir } = E;
  const PISO = 24;   // px: menos que esto no se lee a 1080p
  const barras = (S.barras || []).map((b, i) => ({ ...b, t0: tiempo(b, 0.5 + i * 0.7) }));
  for (const b of barras) {
    if (typeof b.valor !== 'number' || !Number.isFinite(b.valor))
      throw new Error(`la barra ${JSON.stringify(b.etiqueta)} no tiene un valor numérico (vino ${JSON.stringify(b.valor)})`);
    b.dec = Math.min(decimales(b.valor), 6);   // la precisión del dato, no la del redondeo
    if (b.valor !== 0 && Number(b.valor.toFixed(b.dec)) === 0)
      throw new Error(`la barra ${JSON.stringify(b.etiqueta)} vale ${b.valor} y se vería como 0: ` +
                      'usá una unidad más chica (miles -> unidades, % -> puntos básicos)');
  }
  // cuántos decimales tiene el dato: 0.1 + 0.2 da 0.30000000000000004, que es 0,3
  function decimales(v) {
    let d = 0;
    while (d < 20 && Math.abs(Number(v.toFixed(d)) - v) > Math.abs(v) * 1e-12) d++;
    return d;
  }
  // el signo va antes del prefijo ("-$500", no "$-500"), y un número que se ve
  // como cero no lleva signo: el arranque de una barra negativa no es "-0"
  function formato(v, dec) {
    const n = Math.abs(v).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return (v < 0 && /[1-9]/.test(n) ? '-' : '') + (S.prefijo || '') + n + (S.sufijo || '');
  }
  // arriba: lo más alto que puede empezar el gráfico (la cabecera lo baja si hace falta);
  // abajo: se calcula al armar, justo encima de los rótulos y la nota (antes de la banda)
  const G = { x0: 220, x1: 1700, arriba: 330, abajo: 740 };
  const VALOR = 64;                   // px de las cifras: Barlow es más angosta que Inter
  const AIRE_CAT = 24, AIRE_NOTA = 20;
  const ALTO_MIN = 200;   // px de gráfico: ~60 % del alto normal (330, H2); con menos, las barras no se comparan
  const positivo = Math.max(0, ...barras.map(b => b.valor));
  const negativo = Math.min(0, ...barras.map(b => b.valor));
  let dibujarCab, pxVal, escala, cero;

  contrato([tiempo(S.titulo, 0), ...barras.map(b => b.t0)], () => {
    const cab = cabecera(S.titulo, S.kicker);
    dibujarCab = cab.dibujar;
    const slot = (G.x1 - G.x0) / Math.max(1, barras.length);
    const ancho = Math.min(240, slot * 0.56);
    const cabe = slot - 24;
    // el número más ancho tiene que entrar en su slot; si ni al piso entra, se avisa
    pxVal = Math.min(VALOR, ...barras.map(b => VALOR * cabe / Math.max(1, medir(formato(b.valor, b.dec), VALOR, 700))));
    if (pxVal < PISO)
      throw new Error(`los números de las ${barras.length} barras no entran ni a ${PISO} px: ` +
                      'usá menos barras o una unidad más grande (miles, millones)');
    // Primero lo que va debajo del gráfico (rótulos y nota), medido: el gráfico termina
    // justo arriba de eso, así usa todo el alto hasta la banda de subtítulos.
    // los rótulos de categoría van a un solo tamaño; el que no entra a PISO se parte en renglones
    const pxCat = Math.max(PISO, Math.min(36, ...barras.map(b => 36 * cabe / Math.max(1, medir(b.etiqueta, 36, 500)))));
    barras.forEach((b, i) => {
      b.cx = G.x0 + slot * (i + 0.5);
      b.cat = crear('div', 'cat', document.body, b.etiqueta);
      b.cat.dataset.caja = 'categoria ' + b.etiqueta;
      b.cat.dataset.t = b.t0;
      Object.assign(b.cat.style, { left: (b.cx - cabe / 2) + 'px', width: cabe + 'px', top: '0px', fontSize: pxCat + 'px' });
      if (b.cat.scrollWidth > b.cat.clientWidth + 1 || b.cat.getBoundingClientRect().height > pxCat * 1.25 * 2 + 1)
        throw new Error(`el rótulo ${JSON.stringify(b.etiqueta)} no entra en dos renglones de ${pxCat} px: acortalo`);
    });
    const altoCat = Math.max(0, ...barras.map(b => b.cat.getBoundingClientRect().height));
    let nota = null;
    if (S.nota) {
      nota = crear('div', 'nota mono', document.body, S.nota);
      nota.dataset.caja = 'nota';
    }
    // de abajo hacia arriba, desde la banda: la nota, los rótulos y ahí termina el gráfico
    let piso = E.BANDA - 2;
    if (nota) {
      nota.style.top = piso + 'px';
      piso -= nota.getBoundingClientRect().bottom - piso;   // su alto medido ya en su lugar
      nota.style.top = piso + 'px';
      piso -= AIRE_NOTA;
    }
    barras.forEach(b => { b.cat.style.top = (piso - altoCat) + 'px'; });
    G.abajo = piso - altoCat - AIRE_CAT;
    // el número de la barra más alta va pxVal*1.4 por encima de ella: también tiene que
    // quedar debajo de la cabecera medida
    const encima = pxVal * 1.4;
    G.arriba = cab.techo(G.arriba - encima, encima + ALTO_MIN, G.abajo) + encima;
    escala = (G.abajo - G.arriba) / ((positivo - negativo) || 1);
    cero = G.arriba + positivo * escala;   // la línea de base es el cero, no el borde de abajo
    const linea = crear('div', 'base');
    Object.assign(linea.style, { left: (G.x0 - 20) + 'px', width: (G.x1 - G.x0 + 40) + 'px', top: cero + 'px' });
    barras.forEach(b => {
      b.h = Math.abs(b.valor) * escala;
      b.el = crear('div', 'barra' + (b.destacar ? ' destacada' : ''));
      Object.assign(b.el.style, { left: (b.cx - ancho / 2) + 'px', width: ancho + 'px' });
      b.val = crear('div', 'valor', document.body, formato(b.valor, b.dec));
      b.val.dataset.caja = 'valor ' + b.etiqueta;
      b.val.dataset.t = b.t0;   // la puerta (verificar.py) mide que no se vea antes
      Object.assign(b.val.style, { left: b.cx + 'px', fontSize: pxVal + 'px' });
    });
  }, t => {
    dibujarCab(t);
    for (const b of barras) {
      const p = resorte(t - b.t0, 1, 1.5);
      // la barra crece desde la línea de cero: hacia arriba, o hacia abajo si es negativa
      const h = b.h * p;
      const top = b.valor < 0 ? cero : cero - h;
      Object.assign(b.el.style, { height: h.toFixed(2) + 'px', top: top.toFixed(2) + 'px', opacity: t >= b.t0 ? 1 : 0 });
      b.val.textContent = formato(b.valor * p, b.dec);
      // el número va arriba de la barra; el de una negativa, arriba de la línea de cero
      b.val.style.top = ((b.valor < 0 ? cero : cero - h) - pxVal * 1.4).toFixed(2) + 'px';
      b.val.style.opacity = aparecer(t, b.t0);
      b.cat.style.opacity = aparecer(t, b.t0);
    }
  });
</script>
